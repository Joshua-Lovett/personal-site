<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Private | Joshua Lovett</title>
<meta name="theme-color" content="#0b0909">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<script src="/assets/lib.js"></script>
<script src="/assets/config.js"></script>
<script>
shell(PUBLIC_URL + "/#about");
const ROUTES = [["todos", "To-dos"], ["goals", "Goals"], ["dreamboard", "Dreamboard"], ["done", "Done"], ["connections", "Connections"]];
const KEYS = ["todos", "goals", "dreamboard", "done", "connections"];
const cur = () => { const id = location.hash.slice(1); return ROUTES.some((r) => r[0] === id) ? id : "todos"; };
let todoFilter = "today";
try { todoFilter = localStorage.getItem("todoFilter") || "today"; } catch (e) {}

/* ---- data: loaded from and saved to the repository through /api ---- */
const state = {};            // key -> { items, sha }
const chains = {};
let pending = 0, loadError = "";
const items = (k) => (state[k] ? state[k].items : []);
const uid = () => Math.random().toString(36).slice(2, 10);
const val = (id) => document.getElementById(id).value.trim();
function toast(msg, ms) {
  let t = document.getElementById("toast");
  if (!t) { t = h("div", { class: "toast", id: "toast", role: "status" }); document.body.append(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, ms || 3200);
}
async function pull(k) {
  const r = await fetch("/api/data/" + k, { cache: "no-store" });
  if (r.status === 401 || r.status === 403) throw new Error("auth");
  if (!r.ok) throw new Error("load");
  const d = await r.json();
  state[k] = { items: d.items || [], sha: d.sha };
}
async function pullAll() {
  try { await Promise.all(KEYS.map(pull)); loadError = ""; }
  catch (e) { loadError = e.message === "auth" ? "auth" : "load"; }
}
function push(k) {
  pending++;
  chains[k] = (chains[k] || Promise.resolve()).then(async () => {
    const r = await fetch("/api/data/" + k, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ items: state[k].items, sha: state[k].sha }) });
    if (r.status === 409) { await pull(k); toast("This list changed somewhere else. It was reloaded, so please repeat your last change."); render(); return; }
    if (!r.ok) {
      let d = {}; try { d = await r.json(); } catch (e) {}
      const err = new Error("save"); err.detail = r.status === 401 ? "your sign-in expired, reload the page"
        : d.github_status === 403 || d.github_status === 404 ? "GitHub refused the write, so the GitHub key probably lacks Contents: Read and write permission for this repository"
        : d.github_status ? "GitHub said " + d.github_status + (d.github_message ? ": " + d.github_message : "")
        : d.error === "not_configured" ? "the GITHUB_TOKEN secret is missing" : "server error " + r.status;
      throw err;
    }
    state[k].sha = (await r.json()).sha;
  }).catch(async (e) => {
    toast("Not saved: " + (e.detail || "could not reach the site") + ".", 12000);
    try { await pull(k); } catch (e2) {}
    render();
  }).finally(() => { pending--; });
  return chains[k];
}
const touch = (...ks) => { ks.forEach(push); render(); };

/* ---- linked to-dos and goal steps share one done state ---- */
const linkedStep = (t) => { if (!t.link) return null; const g = items("goals").find((x) => x.id === t.link.goal); return g ? (g.steps || []).find((x) => x.id === t.link.step) : null; };
const todoDone = (t) => { const s = linkedStep(t); return !!(t.done || (s && s.done)); };
const linkedTodos = (g, s) => items("todos").filter((t) => t.link && t.link.goal === g.id && t.link.step === s.id);
const stepDone = (g, s) => !!(s.done || linkedTodos(g, s).some((t) => t.done));
const pct = (g) => (g.steps && g.steps.length ? Math.round(100 * g.steps.filter((s) => stepDone(g, s)).length / g.steps.length) : g.progress || 0);
function toggleTodo(t) {
  const nd = !todoDone(t), s = linkedStep(t);
  t.done = nd; t.doneAt = nd ? todayStr() : null;
  if (s) s.done = nd;
  touch("todos", ...(s ? ["goals"] : []));
}
function toggleStep(g, s) {
  const nd = !stepDone(g, s), lt = linkedTodos(g, s);
  s.done = nd;
  lt.forEach((t) => { t.done = nd; t.doneAt = nd ? todayStr() : null; });
  touch("goals", ...(lt.length ? ["todos"] : []));
}

/* ---- shared pieces ---- */
const field = (id, label, ctl) => h("div", { class: "field" }, h("label", { for: id }, label), ctl);
const del = (fn, label) => h("button", { class: "icon-btn", type: "button", "aria-label": label, title: label, onclick: fn }, "×");
const check = (id, on, label, fn) => h("input", { type: "checkbox", class: "chk", id, checked: !!on, "aria-label": label, onchange: fn });

/* ---- to-dos ---- */
function todosView() {
  const all = items("todos"), t0 = todayStr();
  const open = all.filter((t) => !todoDone(t));
  const overdue = open.filter((t) => t.date && t.date < t0).length;
  const todayN = open.filter((t) => t.date === t0).length;
  const cmp = (a, b) => (a.date || "9999").localeCompare(b.date || "9999") || (a.start || "99:99").localeCompare(b.start || "99:99");
  let shown;
  if (todoFilter === "today") shown = open.filter((t) => t.date && t.date <= t0);
  else if (todoFilter === "upcoming") shown = open.filter((t) => t.date > t0);
  else if (todoFilter === "anytime") shown = open.filter((t) => !t.date);
  else shown = all.filter((t) => todoDone(t));
  shown = shown.slice().sort(cmp);
  const groups = [];
  shown.forEach((t) => { const k = t.date || ""; let g = groups[groups.length - 1]; if (!g || g.k !== k) { g = { k, items: [] }; groups.push(g); } g.items.push(t); });

  const form = h("form", { class: "addform", id: "todo-form", onsubmit: (e) => {
    e.preventDefault();
    const title = val("t-title"); if (!title) return;
    all.push({ id: uid(), title, date: val("t-date"), start: val("t-start"), end: val("t-end"), tag: val("t-tag"), done: false });
    touch("todos");
    document.getElementById("t-title").value = ""; document.getElementById("t-start").value = ""; document.getElementById("t-end").value = ""; document.getElementById("t-tag").value = "";
    document.getElementById("t-title").focus();
  } },
    field("t-title", "To-do", h("input", { type: "text", id: "t-title", required: true, placeholder: "Send the project invoice", autocomplete: "off" })),
    h("div", { class: "row" },
      field("t-date", "Date", h("input", { type: "date", id: "t-date", value: t0 })),
      field("t-start", "Start", h("input", { type: "time", id: "t-start" })),
      field("t-end", "End", h("input", { type: "time", id: "t-end" })),
      field("t-tag", "Tag", h("input", { type: "text", id: "t-tag", placeholder: "Work", autocomplete: "off" }))),
    h("div", {}, h("button", { class: "btn", type: "submit" }, "Add to schedule")));

  const seg = h("div", { class: "seg", role: "group", "aria-label": "Filter to-dos" }, [["today", "Today"], ["upcoming", "Upcoming"], ["anytime", "Anytime"], ["done", "Completed"]].map(([k, l]) =>
    h("button", { type: "button", "aria-pressed": String(todoFilter === k), onclick: () => { todoFilter = k; try { localStorage.setItem("todoFilter", k); } catch (e) {} render(); } }, l)));

  return h("div", {},
    pageHead("Private", "To-dos", "Your schedule, in order. Overdue items stay on Today until they are done."),
    h("div", { class: "summary" },
      h("div", {}, h("b", { class: "mono" }, todayN), h("span", {}, "Due today")),
      h("div", {}, h("b", { class: "mono", style: overdue ? "color:var(--amber)" : "" }, overdue), h("span", {}, "Overdue")),
      h("div", {}, h("b", { class: "mono" }, all.filter((t) => todoDone(t)).length), h("span", {}, "Completed"))),
    form, seg,
    groups.length ? groups.map((g) => {
      const late = g.k && g.k < t0 && todoFilter !== "done";
      return h("section", { class: "day" },
        h("h3", { class: late ? "late" : "" }, g.k ? (g.k === t0 ? "Today" : fmtDay(g.k)) : "Anytime", late ? h("small", {}, "OVERDUE") : null, h("small", {}, g.items.length + (g.items.length === 1 ? " ITEM" : " ITEMS"))),
        g.items.map((t) => h("div", { class: "item" + (todoDone(t) ? " is-done" : "") },
          check("td-" + t.id, todoDone(t), "Mark " + t.title + (todoDone(t) ? " not done" : " done"), () => toggleTodo(t)),
          h("span", { class: "when" + (t.start ? "" : " none") }, t.start ? fmtTime(t.start) + (t.end ? " – " + fmtTime(t.end) : "") : "All day"),
          h("span", { class: "name" }, h("span", {}, t.title), t.tag ? h("span", { class: "tag" }, t.tag) : null, t.link ? h("span", { class: "tag" }, "Goal step") : null),
          del(() => { all.splice(all.indexOf(t), 1); touch("todos"); }, "Delete " + t.title))));
    }) : empty(todoFilter === "done" ? "Nothing completed yet" : "Nothing here", todoFilter === "today" ? "No to-dos due. Add one above." : "Add a to-do above."));
}

/* ---- goals ---- */
function goalsView() {
  const list = items("goals");
  const form = h("form", { class: "addform", id: "goal-form", onsubmit: (e) => {
    e.preventDefault();
    const title = val("g-title"); if (!title) return;
    list.push({ id: uid(), title, why: val("g-why"), area: val("g-area"), target: val("g-date"), progress: 0, steps: [] });
    touch("goals"); e.target.reset();
  } },
    field("g-title", "Goal", h("input", { type: "text", id: "g-title", required: true, placeholder: "Run a half marathon", autocomplete: "off" })),
    h("div", { class: "row" },
      field("g-area", "Area", h("input", { type: "text", id: "g-area", placeholder: "Health", autocomplete: "off" })),
      field("g-date", "Target date", h("input", { type: "date", id: "g-date" }))),
    field("g-why", "Why it matters", h("textarea", { id: "g-why", rows: "2" })),
    h("div", {}, h("button", { class: "btn", type: "submit" }, "Add goal")));
  return h("div", {},
    pageHead("Private", "Goals", "What you are working toward, how far along it is, and the steps in between."),
    form,
    list.length ? h("div", { class: "grid" }, list.map(goalCard)) : empty("No goals yet", "Add one above."));
}
function goalCard(g) {
  g.steps = g.steps || [];
  const stepForm = h("form", { class: "mini", onsubmit: (e) => {
    e.preventDefault(); const inp = e.target.querySelector("input"); const t = inp.value.trim(); if (!t) return;
    g.steps.push({ id: "s" + uid(), t, done: false }); touch("goals");
  } }, h("input", { type: "text", id: "step-" + g.id, placeholder: "Add a step", autocomplete: "off", "aria-label": "Add a step to " + g.title }), h("button", { class: "btn ghost", type: "submit" }, "Add"));
  return h("article", { class: "card" },
    h("div", { class: "top" }, h("h3", {}, g.title), del(() => { if (confirm("Delete the goal \"" + g.title + "\"?")) { items("goals").splice(items("goals").indexOf(g), 1); touch("goals"); } }, "Delete goal")),
    g.area ? h("div", {}, h("span", { class: "tag" }, g.area)) : null,
    g.why ? h("p", {}, g.why) : null,
    h("div", { class: "bar" }, h("i", { style: "width:" + pct(g) + "%" })),
    h("div", { class: "meter" }, h("span", {}, pct(g) + "% done"), g.target ? h("span", {}, "by " + fmtDay(g.target)) : null),
    g.steps.length ? h("ul", { class: "steps" }, g.steps.map((s, i) => { if (!s.id) s.id = "s" + (i + 1); return h("li", { class: stepDone(g, s) ? "done" : "" },
      check("s-" + g.id + "-" + s.id, stepDone(g, s), s.t, () => toggleStep(g, s)),
      h("span", { class: "t" }, s.t),
      del(() => { g.steps.splice(g.steps.indexOf(s), 1); touch("goals"); }, "Remove step")); })) : null,
    stepForm);
}

/* ---- dreamboard, done, connections (updated through Claude) ---- */
function dreamView() {
  const list = items("dreamboard");
  return h("div", {}, pageHead("Private", "Dreamboard", "The life, places and things you are building toward. Tell Claude what to pin."),
    list.length ? h("div", { class: "dream" }, list.map((d) => h("article", { class: "tile" },
      d.img ? h("img", { src: d.img, alt: d.title, loading: "lazy" }) : h("div", { class: "ph", "aria-hidden": "true" }, (d.title[0] || "?").toUpperCase()),
      h("div", { class: "body" }, h("h3", {}, d.title), d.area ? h("div", {}, h("span", { class: "tag" }, d.area)) : null, d.note ? h("p", { class: "muted", style: "margin:0" }, d.note) : null))))
    : empty("The board is empty", "Tell Claude what belongs on it."));
}
function doneView() {
  const entries = items("done").concat(items("todos").filter((t) => todoDone(t)).map((t) => ({ title: t.title, date: t.doneAt || t.date || "", area: t.tag, auto: true })))
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const nodes = []; let last = "";
  entries.forEach((e) => {
    const m = e.date ? parseDay(e.date).toLocaleDateString(undefined, { month: "long", year: "numeric" }) : "Undated";
    if (m !== last) { nodes.push(h("div", { class: "month" }, m)); last = m; }
    nodes.push(h("div", { class: "entry" }, h("span", { class: "d" }, e.date ? fmtDay(e.date) : ""),
      h("div", {}, h("h3", {}, e.title), e.note ? h("p", {}, e.note) : null, e.area ? h("p", {}, h("span", { class: "tag" }, e.area)) : null),
      e.auto ? h("span", { class: "muted mono", style: "font-size:11px" }, "TO-DO") : h("span")));
  });
  return h("div", {}, pageHead("Private", "Done", "Everything you have finished. Completed to-dos land here automatically."),
    entries.length ? h("div", { class: "log" }, nodes) : empty("Nothing logged yet", "Finish a to-do, or tell Claude what you did."));
}
function connView() {
  const list = items("connections");
  return h("div", {}, pageHead("Private", "Connections", "Your other apps and accounts, kept in one place."),
    list.length ? h("div", { class: "grid" }, list.map((c) => h("article", { class: "card" },
      h("h3", {}, c.name), c.note ? h("p", {}, c.note) : null,
      c.url ? h("a", { href: c.url, target: "_blank", rel: "noopener" }, "Open") : null)))
    : empty("No apps added", "Tell Claude which apps and accounts to list here."));
}

const VIEWS = { todos: todosView, goals: goalsView, dreamboard: dreamView, done: doneView, connections: connView };
function render() {
  const id = cur();
  renderNav([
    { label: "Public", links: [{ id: "home", href: PUBLIC_URL + "/#about", label: "About", out: true }, { id: "home2", href: PUBLIC_URL + "/#projects", label: "Projects", out: true }] },
    { label: "Private", links: ROUTES.map(([i, l]) => ({ id: i, href: "#" + i, label: l })) }
  ], id);
  const main = document.getElementById("main");
  if (loadError) {
    main.replaceChildren(h("div", { class: "err" }, loadError === "auth"
      ? "Your sign-in could not be confirmed for saving changes. Reload the page and sign in again. If this keeps happening, the site's connection settings need attention."
      : "Could not load your lists. Reload the page. If it keeps failing, tell Claude."));
    return;
  }
  if (!state.todos) { main.replaceChildren(h("p", { class: "muted" }, "Loading your lists…")); return; }
  main.replaceChildren(VIEWS[id]());
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
/* Pick up changes Claude made while this tab was in the background. */
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || pending) return;
  const a = document.activeElement;
  await pullAll();
  if (!(a && /INPUT|TEXTAREA/.test(a.tagName))) render();
});
render();
pullAll().then(render);
</script>
</body>
</html>
