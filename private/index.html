<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Private | Joshua Lovett</title>
<meta name="theme-color" content="#0b0909">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<script src="/assets/lib.js"></script>
<script src="/assets/config.js"></script>
<script>
shell(PUBLIC_URL + "/#about");
const ROUTES = [["todos", "To-dos"], ["goals", "Goals"], ["dreamboard", "Dreamboard"], ["done", "Done"], ["connections", "Connections"]];
const cur = () => { const id = location.hash.slice(1); return ROUTES.some((r) => r[0] === id) ? id : "todos"; };
let todoFilter = "today";
try { todoFilter = localStorage.getItem("todoFilter") || "today"; } catch (e) {}

const items = async (k) => (await load("/data/" + k + ".json")).items || [];

/* ---- to-dos ---- */
async function todosView() {
  const all = await items("todos"), t0 = todayStr();
  const open = all.filter((t) => !t.done);
  const overdue = open.filter((t) => t.date && t.date < t0).length;
  const todayN = open.filter((t) => t.date === t0).length;
  const cmp = (a, b) => (a.date || "9999").localeCompare(b.date || "9999") || (a.start || "99:99").localeCompare(b.start || "99:99");
  let shown;
  if (todoFilter === "today") shown = open.filter((t) => t.date && t.date <= t0);
  else if (todoFilter === "upcoming") shown = open.filter((t) => t.date > t0);
  else if (todoFilter === "anytime") shown = open.filter((t) => !t.date);
  else shown = all.filter((t) => t.done);
  shown = shown.slice().sort(cmp);
  const groups = [];
  shown.forEach((t) => { const k = t.date || ""; let g = groups[groups.length - 1]; if (!g || g.k !== k) { g = { k, items: [] }; groups.push(g); } g.items.push(t); });
  const seg = h("div", { class: "seg", role: "group", "aria-label": "Filter to-dos" }, [["today", "Today"], ["upcoming", "Upcoming"], ["anytime", "Anytime"], ["done", "Completed"]].map(([k, l]) =>
    h("button", { type: "button", "aria-pressed": String(todoFilter === k), onclick: () => { todoFilter = k; try { localStorage.setItem("todoFilter", k); } catch (e) {} render(); } }, l)));
  return h("div", {},
    pageHead("Private", "To-dos", "Your schedule, in order. Overdue items stay on Today until they are done. Tell Claude to add or complete items."),
    h("div", { class: "summary" },
      h("div", {}, h("b", { class: "mono" }, todayN), h("span", {}, "Due today")),
      h("div", {}, h("b", { class: "mono", style: overdue ? "color:var(--amber)" : "" }, overdue), h("span", {}, "Overdue")),
      h("div", {}, h("b", { class: "mono" }, all.filter((t) => t.done).length), h("span", {}, "Completed"))),
    seg,
    groups.length ? groups.map((g) => {
      const late = g.k && g.k < t0 && todoFilter !== "done";
      return h("section", { class: "day" },
        h("h3", { class: late ? "late" : "" }, g.k ? (g.k === t0 ? "Today" : fmtDay(g.k)) : "Anytime", late ? h("small", {}, "OVERDUE") : null, h("small", {}, g.items.length + (g.items.length === 1 ? " ITEM" : " ITEMS"))),
        g.items.map((t) => h("div", { class: "item" + (t.done ? " is-done" : "") },
          h("span", { class: "ck", "aria-label": t.done ? "Done" : "Open" }, t.done ? "✓" : ""),
          h("span", { class: "when" + (t.start ? "" : " none") }, t.start ? fmtTime(t.start) + (t.end ? " – " + fmtTime(t.end) : "") : "All day"),
          h("span", { class: "name" }, h("span", {}, t.title), t.tag ? h("span", { class: "tag" }, t.tag) : null),
          h("span"))));
    }) : empty(todoFilter === "done" ? "Nothing completed yet" : "Nothing here", "Tell Claude what is on your plate and it will appear here."));
}

/* ---- goals ---- */
async function goalsView() {
  const list = await items("goals");
  return h("div", {},
    pageHead("Private", "Goals", "What you are working toward, how far along it is, and the steps in between."),
    list.length ? h("div", { class: "grid" }, list.map((g) => {
      const steps = g.steps || [];
      return h("article", { class: "card" },
        h("h3", {}, g.title),
        g.area ? h("div", {}, h("span", { class: "tag" }, g.area)) : null,
        g.why ? h("p", {}, g.why) : null,
        h("div", { class: "bar" }, h("i", { style: "width:" + (g.progress || 0) + "%" })),
        h("div", { class: "meter" }, h("span", {}, (g.progress || 0) + "% done"), g.target ? h("span", {}, "by " + fmtDay(g.target)) : null),
        steps.length ? h("ul", { class: "steps" }, steps.map((s) => h("li", { class: s.done ? "done" : "" }, h("span", { class: "ck" }, s.done ? "✓" : ""), h("span", { class: "t" }, s.t)))) : null);
    })) : empty("No goals yet", "Tell Claude your goals and they will show up here."));
}

/* ---- dreamboard ---- */
async function dreamView() {
  const list = await items("dreamboard");
  return h("div", {},
    pageHead("Private", "Dreamboard", "The life, places and things you are building toward."),
    list.length ? h("div", { class: "dream" }, list.map((d) => h("article", { class: "tile" },
      d.img ? h("img", { src: d.img, alt: d.title, loading: "lazy" }) : h("div", { class: "ph", "aria-hidden": "true" }, (d.title[0] || "?").toUpperCase()),
      h("div", { class: "body" }, h("h3", {}, d.title), d.area ? h("div", {}, h("span", { class: "tag" }, d.area)) : null, d.note ? h("p", { class: "muted", style: "margin:0" }, d.note) : null))))
    : empty("The board is empty", "Tell Claude what belongs on it, or send pictures to pin."));
}

/* ---- done ---- */
async function doneView() {
  const [log, todos] = await Promise.all([items("done"), items("todos")]);
  const entries = log.concat(todos.filter((t) => t.done).map((t) => ({ title: t.title, date: t.doneAt || t.date || "", area: t.tag, auto: true })))
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const nodes = []; let last = "";
  entries.forEach((e) => {
    const m = e.date ? parseDay(e.date).toLocaleDateString(undefined, { month: "long", year: "numeric" }) : "Undated";
    if (m !== last) { nodes.push(h("div", { class: "month" }, m)); last = m; }
    nodes.push(h("div", { class: "entry" }, h("span", { class: "d" }, e.date ? fmtDay(e.date) : ""),
      h("div", {}, h("h3", {}, e.title), e.note ? h("p", {}, e.note) : null, e.area ? h("p", {}, h("span", { class: "tag" }, e.area)) : null),
      e.auto ? h("span", { class: "muted mono", style: "font-size:11px" }, "TO-DO") : h("span")));
  });
  return h("div", {}, pageHead("Private", "Done", "Everything you have finished. Completed to-dos land here automatically."),
    entries.length ? h("div", { class: "log" }, nodes) : empty("Nothing logged yet", "Tell Claude what you finished and it will be logged here."));
}

/* ---- connections ---- */
async function connView() {
  const list = await items("connections");
  return h("div", {}, pageHead("Private", "Connections", "Your other apps and accounts, kept in one place."),
    list.length ? h("div", { class: "grid" }, list.map((c) => h("article", { class: "card" },
      h("h3", {}, c.name), c.note ? h("p", {}, c.note) : null,
      c.url ? h("a", { href: c.url, target: "_blank", rel: "noopener" }, "Open") : null)))
    : empty("No apps added", "Tell Claude which apps and accounts to list here."));
}

const VIEWS = { todos: todosView, goals: goalsView, dreamboard: dreamView, done: doneView, connections: connView };
async function render() {
  const id = cur();
  renderNav([
    { label: "Public", links: [{ id: "home", href: PUBLIC_URL + "/#about", label: "About", out: true }, { id: "home2", href: PUBLIC_URL + "/#projects", label: "Projects", out: true }] },
    { label: "Private", links: ROUTES.map(([i, l]) => ({ id: i, href: "#" + i, label: l })) }
  ], id);
  const main = document.getElementById("main");
  try { main.replaceChildren(await VIEWS[id]()); }
  catch (e) { main.replaceChildren(h("div", { class: "err" }, "Could not load this section. Reload the page. If it keeps failing, sign in again.")); }
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
render();
</script>
</body>
</html>
